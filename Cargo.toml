[package]
name = "sessions"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "sessions"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
memchr = "2.7"
memmap2 = "0.9"
hashbrown = "0.15"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
parquet = { version = "53", default-features = false }
bytes = "1"

# Windows builds are for local benchmarking only.
[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[features]
avx512 = []
